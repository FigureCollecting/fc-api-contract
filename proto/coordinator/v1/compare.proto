// ============================================================================
// coordinator.v1 — Compare pass-through.
//
// fc-coordinator is the ONLY service fc-mobile talks to. It does not own the
// comparison view; fc-aggregation's spine does, behind read.v1.SpineRead.
// This file is the CLIENT-facing half of that hop:
//
//   fc-mobile ──Connect-Web/TLS──► coordinator.v1.CompareService.Compare
//                                       │ mints the 60-s entitlement assertion
//                                       │ SERVER-SIDE, attaches it per-call
//                                       ▼
//                                  read.v1.SpineRead.Compare  (mesh, mTLS)
//
// PASS-THROUGH DOCTRINE (binding — read before adding ANY field):
//
//  1. The coordinator NEVER reinterprets the spine's answer. `result_json`
//     is read.v1.CompareResponse.result_json carried through BYTE-FOR-BYTE.
//     The coordinator's job on this path is authentication (OIDC + DPoP),
//     authorisation (OpenFGA Check -> entitlement assertion), and nothing
//     else. Any re-derivation here would be a second source of truth.
//
//  2. `result_json` is JSON TEXT, never google.protobuf.Struct. This
//     inherits read.v1's FIDELITY DOCTRINE verbatim: Struct folds every JSON
//     number to float64, which silently corrupts long numeric amounts and
//     product codes. Every timestamp inside the result (asOf, verdictAsOf,
//     lastKnownAsOf, ...) is likewise a raw STRING inside result_json, never
//     google.protobuf.Timestamp. PostgreSQL is the arbiter of meaning; the
//     wire carries the raw token.
//
//  3. `coverage` is a LIFT, not a rewrite. The spine already reports what it
//     withheld inside result_json as `coverage.redacted`. Surfacing that same
//     list as a typed field spares the client a JSON.parse just to decide
//     whether to render an "unavailable to you" affordance. The INVARIANT the
//     server must uphold: coverage.redacted equals the `coverage.redacted`
//     array inside result_json, same members, same order. It is copied, never
//     computed, never filtered, never reordered.
//
// WHY THE REDACTION LIST IS PART OF THE CONTRACT, not an error:
// a caller without the `inventory_levels` entitlement gets a SUCCESSFUL
// response whose stock fields are absent and whose coverage.redacted says
// ["inventory_levels"]. Absence is stated, not implied. With OpenFGA
// unreachable every Check denies and every Compare comes back redacted —
// that is the correct fail-closed state, and this field is how the client
// can tell fail-closed from genuinely-empty.
// ============================================================================

syntax = "proto3";

package coordinator.v1;

// ---------------------------------------------------------------------------
// CompareRequest — mirrors read.v1.CompareRequest field-for-field. The
// coordinator forwards the seed and the clock unchanged; it adds identity
// (from the verified OIDC subject) and entitlements (minted server-side) out
// of band, never as request fields. A client that could name its own subject
// or its own entitlements would be a trusted mint.
// ---------------------------------------------------------------------------
message CompareRequest {
  // Exactly one seed. Neither set -> INVALID_ARGUMENT at the coordinator,
  // before the mesh hop is made.
  oneof seed {
    // GS1 identifier (GTIN-14, zero-padded).
    string gtin14 = 1;

    // A head/redirect-chain id, resolved spine-side via resolveHead().
    string head_id = 2;
  }

  // The caller-supplied clock, ISO-8601, passed through as a RAW STRING so
  // that every orderability verdict stays reproducible from
  // (gathered signals, cfg, now_iso). The coordinator validates the shape and
  // forwards the original characters; it does not restamp with its own wall
  // time, and it does not parse-then-reserialise.
  string now_iso = 3;
}

// ---------------------------------------------------------------------------
// CompareResponse — the spine's answer, unedited, plus the lifted coverage.
// ---------------------------------------------------------------------------
message CompareResponse {
  // read.v1.CompareResponse.result_json, byte-for-byte. heads[], each with
  // perStore[] offers (string amounts/timestamps intact) and editions[],
  // related[], coverage. An empty `heads` array means "no product carries
  // this identifier" — a normal, successful outcome, NOT an error.
  string result_json = 1;

  // The spine's coverage report, lifted out of result_json. Set on every
  // successful response, even when nothing was withheld (an empty `redacted`
  // means "you saw everything the spine holds").
  //
  // PRESENCE — read this before writing `res.coverage.redacted`. This is a
  // proto3 message field, so it carries presence and the generated type is
  // `coverage?: Coverage | undefined`. A client MUST null-check it
  // (`res.coverage?.redacted`): a server that omits the field decodes to
  // undefined, not to an empty Coverage, and the property access throws.
  Coverage coverage = 2;
}

// ---------------------------------------------------------------------------
// Coverage — the two facts about this response a client must be able to read
// WITHOUT parsing result_json: what was withheld, and which semantics produced
// it. Both are copied out of the spine's own coverage object; neither is
// computed here.
//
// The spine's coverage object has more to say (crossReleaseLinked, note, which
// stores were gathered, which were stale). Those are additive field numbers
// 3..n when a screen needs them. Shipping them speculatively would be a
// placeholder; this contract has none.
// ---------------------------------------------------------------------------
message Coverage {
  // Entitlement literals for the facets withheld from `result_json`, e.g.
  // ["inventory_levels"]. These are the SAME literals the entitlement
  // assertion names — the vocabulary is shared with the spine contract, not
  // reinvented here. Empty means nothing was withheld.
  //
  // Copied verbatim from result_json's coverage.redacted: same members, same
  // order. See the PASS-THROUGH DOCTRINE above.
  //
  // PRESENCE NOTE: the spine's field is OPTIONAL and is stamped only when
  // something was actually removed; it never emits an empty array. A proto3
  // `repeated string` has no presence, so spine-absent maps to wire-empty and
  // spine-present maps to the same members. The mapping is 1:1 and preserves
  // the distinction the spine exists to draw: "no inventory data" versus "you
  // may not see it".
  repeated string redacted = 1;

  // The spine's `coverage.semanticsRev` — a 16-hex-char stable hash of the
  // orderability semantics that produced the verdicts inside result_json.
  // fc-aggregation stamps it on EVERY CompareResult (it is required there,
  // never optional), so a conforming coordinator always fills this in.
  //
  // WHY IT IS LIFTED, when the fidelity doctrine says the blob is opaque:
  // `buf breaking --use FILE` protects this ENVELOPE and cannot see inside
  // result_json. The spine can change how a verdict is derived without any
  // wire signal at all. semanticsRev is the one marker that says so, and a
  // client that caches or reasons about verdicts needs it without parsing the
  // blob — which is the same argument that justifies lifting `redacted`.
  //
  // Copied verbatim, like `redacted`. It is a hash, not a version number:
  // compare it for equality, never for order.
  string semantics_rev = 2;
}

// ---------------------------------------------------------------------------
// CompareService — one RPC, READ-ONLY, unary by design (a comparison is a
// single derived-read unit of work).
//
// ERROR CONTRACT:
//   * neither seed set, or an unparseable now_iso -> INVALID_ARGUMENT,
//     before any mesh call.
//   * missing/invalid OIDC token or DPoP proof -> UNAUTHENTICATED. A route
//     that requires a nonce answers the nonce-less case with
//     error="use_dpop_nonce" and a fresh DPoP-Nonce; the retry succeeds.
//   * unknown seed (no product carries it) -> OK, heads == [] inside
//     result_json. NOT an error.
//   * the caller lacks an entitlement -> OK, with the facet absent from
//     result_json and named in coverage.redacted. NOT an error.
//   * spine unreachable / OpenFGA unreachable at mint time -> UNAVAILABLE
//     only for the transport failure; an authorisation DENY is a successful,
//     redacted response.
// ---------------------------------------------------------------------------
service CompareService {
  rpc Compare(CompareRequest) returns (CompareResponse);
}
