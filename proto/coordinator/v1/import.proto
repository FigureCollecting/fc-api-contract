// ============================================================================
// coordinator.v1 — importing a user's MyFigureCollection export.
//
// ONLINE ONLY (R1; Ross, 2026-09-27). A client calls ImportMfcExport only while
// online, after it has pushed its whole outbox and has every push answered, so
// the import sees every edit of the device that asks for it. The coordinator
// resolves each MFC id to a spine product, decides what the export means for
// each figure (THE SERVER DECIDES below) under the per-user lock and as one
// server transaction (sync.proto rule 7), and writes the user's facets through
// the same apply path as SyncService.Push, so the result reaches every device
// as ordinary Delta events. The response carries the review set (R7), which
// the client presents once it has pulled the import's transaction (THE REVIEW
// SET). Other devices may still be offline with edits the import has not seen;
// LATE EDITS AND REPLAY below gives them the result they would have had by
// pushing first.
//
// VERSIONING (0.3.0). Every write of one import is versioned
//
//     <instant>#<per-user import counter>#<reserved server device>
//
// where <instant> is the server's clock when the import starts (at most
// server_now) and the reserved server device is the all-zero id (sync.proto
// rule 5). The per-user import counter increases with every import. Which
// side's change stands is not decided by version: THE SERVER DECIDES below
// decides, and each write of a decision or an answer is minted above the
// facet's current version. The import stamps edited_at as midnight UTC of
// export_date ("YYYY-MM-DDT00:00:00Z") and tz as "UTC".
//
// ROWS. An ID is made canonical first (canonicalMfcId): leading zeros are
// stripped, and what remains must be 1 to 64 ASCII digits. Every later step,
// occurrence ids and origin facets included, uses the canonical id. A row is
// unresolved, with the first reason that applies, in this order:
// "invalid_id" (no canonical id: "0", a sign, a space, a non-ASCII digit),
// "duplicate_id" (an earlier row has the same canonical id; the first row
// stands), "invalid_count" (Count is neither blank nor ASCII digits),
// "count_over_99", "no_product". An unresolved row writes nothing. One
// unresolved for invalid_count, count_over_99 or no_product also leaves its
// id's earlier copies and their figure values alone; a duplicate_id row
// leaves its id to the first row, and an invalid_id row names no id. Count
// blank means 1; Count 0 states no copies, and the row still states its
// figure values. Owned, Ordered and Wished map to the kinds owned, ordered
// and wished. A row's figure values are uf/{head_id}/score ("N/10"), note
// and wishability (1..5; 0 or blank is no value).
//
// OCCURRENCE IDS. A copy the import creates at ordinal k gets
//
//     occ_id = importOccIdFromMac(HMAC-SHA256(key, "{user_id}:mfc:{mfc_id}:{k}"))
//
// the MAC's first 16 bytes as an RFC 9562 version 8 uuid, lowercase and
// dashed (user_id the coordinator's user uuid, mfc_id the canonical id;
// mfcImportOccName builds the name). The key is the import occ-id key, held
// by the coordinator alone: never sent to a client, logged or shipped in this
// package (golden/key-vectors.json uses a published test key that is never
// the production one). So an occurrence key and a user id do not reveal an
// MFC id, and a retry of an import mints the same ids. With a copy it creates
// the import writes occ/{occ}/origin {site "mfc", native_id, ordinal},
// server-owned, and it finds its copies later through origin facets, never by
// recomputing ids: rotating or losing the key changes only the ids of copies
// created afterwards, and duplicates or re-keys nothing. The key never
// changes during an import.
//
// THE SERVER DECIDES (Ross, 2026-09-27: design A, with the review's fixes F1
// to F3). A client never compares anything with MFC: it sends every edit with
// the basis it was made on, shows the server's state, and shows and answers
// the items the server raises (sync.proto rule 6, THE IMPORT, ON A CLIENT).
// The server compares at the grain MFC is kept at, one figure, and derives its
// state by replaying its inputs in a canonical order, so an edit that reaches
// it late ends where it would have ended had it been pushed first.
//
//   FIGURE. A spine survivor S. Every MFC row whose id resolves to a head whose
//   survivor is S belongs to S, and every copy whose head resolves to S is a
//   copy of S. A KIND is owned, ordered or wished; a copy that is former,
//   removed (status tombstone) or re-pointed to another figure is OUT of S.
//   ROW BASE (server-internal, per MFC id): what the last import that settled
//   the row took from MFC, its head, kind, Count, score, note and wishability.
//   COPY BASE (server-internal, per copy): the kind (or OUT) and head the last
//   settlement gave the copy on MFC's behalf. MFC's Counts beyond the copies
//   with a base of that kind are PLACEHOLDERS: copies MFC counts and the app
//   does not have.
//   FIELD BASE (server-internal, per head and field): the value MFC last
//   stated, as settled.
//   BASIS: on every pushed event, the commit cursor of the last transaction
//   the device had applied when it made the edit (sync.proto SyncEvent.basis).
//   FRAME (F1): every import writes one marker event last, imp/{site}/import.
//   For every figure the import decides, whether it writes to it or only moves
//   its bases, last_seq(I, S) is the marker's position. The server keeps, per
//   import and decided figure, last_seq(I, S) and S as it stood just before I.
//   LATE EDIT: a pushed edit to a copy or field of S whose basis is before
//   last_seq(I, S) for an import I that arrived before it: the device made it
//   without having seen what I decided for S. Any other edit is KNOWING.
//
// THE FIGURE DECISION. For each figure S that an export row or a row base
// belongs to, M_k is the sum of the export's Counts of kind k over the rows of
// S, B_k the sum of their row-base Counts and A_k the live copies of S of kind
// k.
//
//   * M == B for every kind: MFC changed no count. Nothing is written and no
//     base moves, so an app change stays an app change.
//   * A == M for every kind: both sides reached the same counts. Nothing is
//     written, and every copy of S takes its current state as its base.
//   * Otherwise MFC's change is split into TRANSITIONS: d_k = M_k - B_k gives,
//     in this order, ordered->owned (arrivals), wished->ordered and
//     wished->owned, as many as both sides allow, then k->OUT for each
//     remaining negative d_k and OUT->k for each remaining positive d_k. The
//     app's transitions are one per copy whose base differs from its current
//     state (a copy with no base has base OUT). MATCHING pairs each MFC
//     transition with an app transition of the same (from, to), the app's
//     copies taken in occ-id order: a pair is the same change on both sides.
//     - No MFC transition is left: MFC's changes are all in the app already.
//       Nothing is written; the paired copies take their current state as
//       base, and the app's unpaired changes keep theirs.
//     - No app transition is left, or none shares a kind with an MFC one left:
//       only MFC made the rest, and the import MATERIALIZES it.
//     - Otherwise the counts are a CONFLICT.
//
//   The fields (score, note, wishability), each on its own: the rows of S whose
//   export value differs from their own row base are the CHANGED rows (an
//   absent row states no value). No changed row: nothing. Changed rows stating
//   different values: a CONFLICT. Otherwise, with v the new value, A the value
//   rule 6 displays for S and B the field base of the head displayed (else of
//   any head of S): when A == v only the base moves; when A == B only MFC
//   changed it, and v is written to rule 6's write target (a tombstone on every
//   head of S holding it when v is no value) and the base moves; otherwise it
//   is a CONFLICT. So MFC's change to one of several merged rows is found
//   against that row's own base, never mistaken for another row's value.
//
//   ONE DECISION PER FIGURE. If any part is a CONFLICT, nothing of S is written
//   and none of its bases move. Otherwise every part's writes go out together,
//   and the row bases of S become the export's rows (a row of S absent from
//   the export loses its row base).
//
// MATERIALIZE runs on the copies the app left unchanged (base equal to current
// state), for each MFC transition left:
//   * x->y: a placeholder of x becomes one of y and nothing is written; else
//     the unchanged copy of kind x with the lowest occ id gets status y.
//   * x->OUT: a placeholder of x is consumed; else an unchanged live copy of
//     kind x is removed (status tombstone), one with an origin before one
//     without, then the highest occ id.
//   * OUT->y: the lowest-id copy of S an import removed that is still unchanged
//     is restored (status y, filing kept); else a copy is created for the
//     lowest-numbered row of S whose Count exceeds its live copies of kind y,
//     counting the copies created in this decision, at that row's lowest unused
//     ordinal: its origin, head and status, in that order.
// The import never restores a former copy, never writes former or a disposal,
// and never touches a copy with no base unless the decision counted or paired
// it. A copy stays one an import removed until an import restores it, whatever
// an answer or a device writes to it meanwhile.
//
// ROW MOVED. A row whose base head and new head resolve to different
// survivors, with no merge between them, was moved by the spine: MFC did not
// change it. When every copy with the row's origin and base on the old figure
// is unchanged, the import re-points each live one to the new head and moves
// its base, and each figure value the row alone stated, unchanged in the app,
// moves with it (a tombstone on the old figure, the value under the new head).
// If the app changed any of them nothing moves, and each figure's decision
// shows the difference. A row unresolved for invalid_count, count_over_99 or
// no_product states nothing new: its row base stands as its statement.
//
// THE MFC PROJECTION (R2). MFC keeps one entry per item id: one status (Owned,
// Ordered or Wished), a Count, and the score, note and wishability. MFC's side
// of a figure S is its MFC ROWS: the export's rows of S, and each row base of S
// the export lacks, at Count 0, each with the field values it states. The app's
// side, as MFC could state it, is what THE ALIGN PLAN (ALIGN-MFC) makes of those
// rows for the app's live copies per kind and its displayed score, note and
// wishability. The two sides are compared part by part, the rows' kinds and
// Counts and each field, and a part differs exactly when the plan would change
// it on some row. What no row can take is APP-ONLY RICHNESS MFC cannot
// express: a wished or ordered copy beside owned ones when no row is free for
// its kind (a one-row figure, or merged rows all in use), former copies and
// their dispositions, filings and tags. Richness never raises an item or an
// align-MFC entry by itself.
//
// WHAT AN IMPORT DOES WITH A DECISION. The user's preferences pref/{site}/import
// (sync.proto rule 6) are read when the import starts.
//   * A CONFLICT is a figure item imp/{site}/figure/{S} of kind "conflict"
//     when import_policy is ASK, the default. With FAVOR_APP or FAVOR_MFC the
//     import answers it keep or take itself (ITEMS AND ANSWERS), writes a change
//     entry imp/{site}/change/{S} of kind "favor_app" or "favor_mfc", and the
//     user can undo it like an answer (R5). A preference applies to conflicts
//     only, never to a change only one side made.
//   * A decision that writes, because only MFC changed, on a figure the import
//     had a row base for is written to the copies the app left untouched, and
//     listed with its undo as a change entry of kind "applied" (R3; Ross, CT4
//     (a)). A figure new to the import (no row base) is added, counted in
//     `added` and never listed.
//   * Every other decision settles. Then, when a part of the projection
//     differs and is not acknowledged at its present values (ACKNOWLEDGED), the
//     difference is the app's: MFC has not caught up with it. It writes nothing
//     and is one figure item of kind "divergence" (R4), which an import of the
//     same export neither raises again nor duplicates.
// The items are server-owned facets keyed by the survivor's head_id: a figure
// item, a held-edit card imp/{site}/held/{S}, a change entry and an align-MFC
// entry imp/{site}/align/{S}. Their payload schemas are closed
// (schemas/imp-*.schema.json). A SPINE MERGE re-derives the merged figure: when
// a redirect makes a head no longer a survivor, the figure item, change entry,
// align-MFC entry and acknowledgement of that head and of its survivor end (an
// answer to one is then STALE), and the next import decides the merged figure
// as one, its rows together. Held edits follow their copies to the survivor's
// card.
//
// LATE EDITS AND REPLAY. An edit that meets no frame is applied by LWW, as
// ever. Otherwise the server's state of S is the REPLAY of its inputs in the
// CANONICAL ORDER: imports, answers and spine redirects in arrival order; each
// late edit just before the earliest import it is late for; every other edit at
// its arrival. Device edits merge by LWW among themselves; an import's
// decision and an answer's writes replace facet values whatever their
// versions. When a late edit arrives the server replays S from the oldest
// affected frame, compares the result with what it has emitted for S, and
// emits each difference as a new event, in one transaction. An import's result
// for S is PROVISIONAL until every edit late for it has arrived, and one a late
// edit shows wrong is withdrawn by ordinary later events. The PushResult
// (sync.proto) of such an edit is APPLIED when its value stands after the
// replay and STALE, with `current`, when the replay leaves another value (an
// import placed after it changed the facet, or another device's edit won).
//
// HELD. The server decides HELD once, when a push arrives, for each UNIT of the
// push in push order: the push's edits to one copy's head, status, collection
// and disposal are one unit, held or replayed together; every other edit (a
// tag, a figure value) is a unit with the push's other edits of its key. A unit
// is late when an edit of it is late. The RELEVANCE TEST of a late unit: the
// server replays S both ways, the unit's late edits before their import I and
// at their arrival, every earlier input as decided and the push's later units
// at their arrival, and compares S's LIVE COPIES (each copy's figure and kind,
// or out: a former or removed copy is out whatever facets it keeps; the unit's
// own copies count too) and S's ITEMS (its figure item, change entry and
// align-MFC entry, each by its rev: an item changes when it appears, ends or
// takes a new rev, not when it only shows the app's side anew); the unit passes
// when they differ. Taken in push order, the units' tests step from the whole
// push at its arrival to the push's replay, so the late units of one push never
// excuse each other: what the push would withdraw from a result another device
// acted on is withdrawn in some unit's test.
// A REACTION to a result is an edit, made after that result without having seen
// what withdraws it, that
//   * writes a copy whose live state the two sides leave different;
//   * adds a copy to S: writes the head or status of a copy that had no head
//     when the import ran, judged in arrival order (the server had emitted no
//     head of the copy by the import's marker, wherever a replay places a late
//     head); or
//   * writes the status or head of a copy of S while S had an item, as its
//     device saw it (pending: a device that saw an item only after it ended saw
//     none), that the two sides leave different, or that the side where the
//     result stands has pending with the rev the device saw at or after the
//     result's import I (I raised or kept it), and the other side never has
//     pending at or after I, whatever an answer has done to that item since.
// A unit is HELD (PUSH_OUTCOME_HELD): kept, not replayed, and shown in its
// figure's held-edit card, when
//   (i)   it is late, and a reaction to I's result arrived before it or in the
//         same push: an edit made after I without having seen the unit's replay
//         (knowing for I, whether or not it is late for a later import), the
//         two sides being the two placements, the result standing at arrival.
//         The unit must pass the relevance test, unless the reaction is to an
//         item its device saw that the placement before I never has pending at
//         or after I: an answer (a dismiss, an undo) may since have ended the
//         item, so that both placements end alike. HOLD ON REACTION: another
//         device acted on the result the late edit would withdraw;
//   (ii)  an edit of it was made after a REVISION's import (knowing for that
//         import, whether or not it is late for a later one) and before the
//         revision, which its device had not seen, and is a reaction to the
//         result the revision withdrew, the two sides being S just before the
//         revision, where the result stands, and S after it. Every push that
//         replays a late edit is a revision of that edit's figures; its import
//         is the earliest import those late edits are late for, and its
//         position is its push's commit on the feed (a push that emits nothing
//         is at the feed's last commit, so a device already there has seen it).
//         It is a revision even when it changes nothing against S just before
//         it (an answer may already have ended the item a device reacted to),
//         but a copy an edit adds reacts only to a revision that changes S's
//         live copies or items; a push whose late edits are all held is none.
//         What a revision changes is what its replayed late edits alone make of
//         S: S replayed with them, without the push's answers and knowing
//         edits, against S just before the push, leaving out the late edits'
//         own writes, facet by facet (another facet of a copy they wrote still
//         counts). So an answer's writes are no revision, even in the push of a
//         late edit, and a by-hand tag on the copy a replayed sale took out is
//         applied. An edit that is no reaction (a tag on a copy the revision
//         left alone, a figure value) is applied;
//   (iii) it is late, its basis is before the commit of an answer on S that the
//         server accepted (to any of S's items; a device that had applied the
//         answer's transaction made its edit after the answer), and it passes
//         the relevance test: the user decided without it; or
//   (iv)  it is late for a frame the server no longer keeps. Frames are kept at
//         least 180 days and while any enrolled device's cursor is before them.
// The decision is final: a held unit stays held, whatever arrives later, until
// its card is answered, and a unit replayed is never held later. An answer
// holds no knowing edit: (iii) is for late units, and an answer's writes are no
// revision. The card lists the held units of S whole, oldest first, as many as
// fit in 16 edits, and `more` counts the held edits it does not list. Its keep
// writes the listed edits now, as an answer's writes (above each facet's
// current version, so over any edit made before the keep), each then a knowing
// edit; its take drops them; the card then lists the next.
//
// ITEMS AND ANSWERS. The user answers an item by writing res/{site}/{S} through
// Push, naming the item (figure, held, change or align), its rev and a choice.
// An answer is accepted only while that item of S is pending with that rev;
// otherwise it is STALE, with `current` (the item changed, or another device
// answered first, and the client shows what is there now). The first accepted
// answer wins. An item a replay withdrew and a later replay gives back at the
// same rev is pending with that rev again, so an answer naming it is accepted:
// it answers what the user was asked.
//   * A conflict. keep: every part the rev lists as disputed stays at the app's
//     side, even when a knowing edit has since brought it back to its base
//     (keep does not decide the figure again), and what only MFC changed is
//     still applied, to the copies the app left unchanged. take: MFC's side is
//     made true on the copies MFC tracks (copies with a live base, and
//     placeholders): conversions first, arrivals first, lowest occ id; then
//     removals, highest occ id; then restoring a copy that is out: a tracked
//     one first, one whose base is the kind first, which can bring back a copy
//     the app sold, then one an import removed (not tracked: its base is OUT),
//     lowest occ id first; then new copies, each for the lowest-numbered row of
//     S of the kind, whatever its Count, at that row's lowest unused ordinal. A
//     copy with no base is never changed, but for one an import removed, and a
//     disputed field takes MFC's value. per_copy: the final statuses listed and
//     "app" or "mfc" per disputed field, exactly. After a keep, take or
//     per_copy on a conflict, a take on a divergence, and the undo of a
//     favor_app settlement, the bases REALIGN to MFC's side: the row bases
//     become the export's rows, the field bases MFC's values, and per kind the
//     live copies with the lowest occ ids, up to MFC's Count, get that base;
//     other copies get base OUT, and MFC's Counts beyond the app's copies
//     become placeholders. A keep on a divergence and the undo of an applied or
//     favor_mfc change move no base: they acknowledge the app's side, which
//     stays an app change against MFC's, so a later MFC change that meets it is
//     a conflict. A dismiss and a held-edit card's answer move none either.
//   * A divergence. keep ("MFC is behind") acknowledges it; take makes MFC's
//     side true as for a conflict.
//   * A held-edit card: keep or take, as HELD says.
//   * A change entry. undo: an applied or favor_mfc change is reverted by its
//     undo list, each facet the import wrote back to its value before the
//     import, while every write still holds the value the import wrote (else
//     the undo is STALE); a copy the import created keeps its origin and head,
//     and only its status is tombstoned. The undo of a favor_app settlement is
//     the take its import would have written: the bases the settlement's
//     realignment moved are put back as they stood before it, MFC's side is
//     made true against them as take makes it, and the bases realign; like a
//     take it records the acknowledgement, so the same export raises nothing
//     again. An undo works against the export of the import that made the
//     entry, whatever a later import found: that take, and the realignment
//     after it, use that export's side, and an applied or favor_mfc undo
//     acknowledges MFC's rows as that export stated them. dismiss: it goes.
//   * An align-MFC entry: dismiss.
// REVS. An answer names an item's rev, which is:
//   * A conflict: the raising import with MFC's side and the disputed parts it
//     found, both sides of each (for the counts, the transitions each side left
//     unmatched, each of the app's naming its copy), so it carries the app's
//     side of the disputed parts as that import found it. An import that finds
//     MFC's side unchanged keeps it, whatever the app did meanwhile.
//   * A divergence: the raising import with both sides' values of the parts
//     that differ. An import that finds the same values keeps it; other values,
//     on either side, give a new rev.
//   * A change entry: the import that made it, its kind and its writes.
//   * A held-edit card: the edits it lists.
//   * An align-MFC entry: its actions, so a dismissed entry returns only when
//     they change.
// So a figure item or change entry raised again after it ended has a new rev,
// even when it is identical, and an answer to the old one is STALE. A knowing
// edit never changes a figure item's rev, and a late edit changes it only when
// its replay changes what the raising import found. An item ends by an answer
// naming it and its rev, when a later import finds MFC back at the base or the
// two sides agreeing, when a knowing edit makes the sides of a conflict agree,
// or at a spine merge (WHAT AN IMPORT DOES). The sides of a conflict agree
// when, decided again against the export that raised it, every part of the
// figure is one MFC did not change or one the app now holds at MFC's value (for
// the counts, as many live copies of each kind as MFC's Counts). The item then
// ends and nothing else happens: nothing is written, no base moves, and the
// next import decides the figure. A knowing edit that leaves the sides
// differing leaves the conflict standing, and a late edit leaves it to the
// import it is replayed before. A replay re-derives items like the rest of S: a
// late edit replayed before the import that raised an item can withdraw the
// item or change its rev, and every device sees that as ordinary events (the
// item's tombstone, or its new rev). An answer to an item a replay withdrew or
// re-revved is void: its writes go with it, its recorded PushResult stands, and
// the client shows the item and the facets as they now are. A replay voids an
// accepted answer only when S's live copies and items end the same either way;
// otherwise HELD (iii) holds the late edit.
//
// ACKNOWLEDGED (R4, R7). A keep on a conflict or a divergence, a per_copy
// answer, an undo that restores the app's side, and a FAVOR_APP settlement
// ACKNOWLEDGE the figure: the server records MFC's rows and, for each part of
// the projection that differs, both sides' values, as they stand. A take on a
// conflict or a divergence, a FAVOR_MFC settlement and the undo of a FAVOR_APP
// settlement record them too, with no align-MFC entry, since the user took
// MFC's side. An import raises nothing for a part acknowledged at its present
// values, and records MFC's rows as it found them, so a partial catch-up on MFC
// leaves the rest acknowledged. A part that comes to differ at other values, by
// a new MFC change or a new app change, re-opens the figure (a new item, with a
// new rev); an import that finds every part equal ends the acknowledgement.
//
// ALIGN-MFC (R8; Ross: "enabling us to become their preferred source of
// truth"). For an acknowledged figure that has an MFC id, the server keeps an
// align-MFC entry imp/{site}/align/{S} while THE ALIGN PLAN changes a row: what
// to change on MFC, by hand, so that MFC holds the app's side as it stands now.
// The entry follows every change of the app's side, knowing edits included.
// Each action names an MFC item id and gives MFC's current value and the value
// it should hold: its status, its Count, its score, note or wishability, and
// add_to_list on a row whose Count the entry lowers, or which leaves the
// collection, when the user has configured a disposition list
// (disposition_list, e.g. 206369) and a former copy of that row (by its origin)
// is disposed of as sold or traded. THE ALIGN PLAN takes MFC's rows in
// ascending id; a row at Count 0 is out of the collection. Per kind, while the
// rows of that kind hold more than the app's live copies of it, they give up
// the excess first from the Count beyond their own live copies of the kind
// (copies whose origin is the row), the row with the most such Count first and
// the highest-numbered on a tie, then from the highest-numbered row; a row
// left with none leaves the collection. A kind the app has more of grows its
// lowest-numbered row of that kind, or takes the lowest-numbered row out of the
// collection. The server never writes to MFC; a client links each action to
// the item's page on MFC. An entry clears itself when an import finds MFC
// matching, and a dismissed entry is not shown again until its actions change.
//
// THE REVIEW SET (R7). The response carries, in this order, the pending figure
// items of kind conflict, then divergence, then the held-edit cards, then the
// align-MFC entries as a separate, dismissable group; each group in head_id
// order, each item with the answers it allows, and a bulk answer per group
// (conflict: keep or take; divergence: keep or take; held edits: keep or take;
// align-MFC: dismiss).
// Then the change entries this import made, each with undo. Before it presents
// the review set, or mints any edit or answer, the client that asked for the
// import pulls until it has applied the import's transaction: until its
// replica's marker imp/{site}/import holds an import at or above
// import_number. What the user then does about the review set is knowing,
// placed after the import; an edit minted on an older basis would be a late
// edit, replayed before the import, and would withdraw what the user was
// reacting to. What the user skips stays pending on every device and is
// badged, and an answered or acknowledged item never recurs on an import of an
// unchanged row.
//
// FILING. Whenever the import upserts a copy's status to a kind its filing is
// not of, it writes occ/{occ}/collection {"collection": "{status}/default"}
// in the same batch, as a device kind change does. That is the only filing it
// writes, and it never compares one.
//
// DISPOSITIONS. Ross tracks dispositions on MFC as a list plus a note in a
// user field (GR-Q3). The import MAY write status former and
// occ/{occ}/disposal for rows of the user's configured disposition list; how
// that list and its note map to a disposal is desk item DL, so a 0.3.0 import
// writes neither, whatever pref disposition_list says. No other row, and
// nothing else on the server, writes a former status or a disposal. The import
// never writes a tag, a collection name or a tag name. In 0.3.0 only the
// align-MFC entries read the configured disposition list.
//
// SEMANTIC CHANGE (0.3.0), SAFE ONLY BECAUSE NO IMPORT HAS RUN. 0.2.x wrote
// per-figure holding facets versioned at the export date, and any later
// device edit won. The row counters keep their names; their 0.3.0 meanings
// are on the fields below.
// ============================================================================

syntax = "proto3";

package coordinator.v1;

message ImportMfcExportRequest {
  // The export as UTF-8 text, verbatim. At most 2 MiB; larger is
  // INVALID_ARGUMENT. Columns are found by header, because MFC lets the user
  // choose them: ID and Status are required, a ';' delimiter and quoted
  // fields are accepted, and a duplicated header (MFC writes Price twice) is
  // tolerated.
  string csv_text = 1;

  // The calendar date MFC stamped on the export, "YYYY-MM-DD".
  string export_date = 2;
}

message ImportMfcExportResponse {
  // Rows not returned in `unresolved`: a canonical id first in the export, a
  // valid Count and a product. added + moved + unchanged + kept_newer ==
  // resolved.
  uint32 resolved = 1;

  // Rows the import skipped, each with its reason (ROWS above). Nothing is
  // written for them.
  repeated UnresolvedMfcRow unresolved = 2;

  // Resolved rows of a figure new to the import (it had no row base).
  uint32 added = 3;

  // Resolved rows, not added or kept_newer, of a figure whose decision wrote at
  // least one occurrence status: a kind change, e.g. Ordered to Owned, or a
  // Count change that added or removed copies.
  uint32 moved = 4;

  // Resolved rows neither added, moved nor kept_newer.
  uint32 unchanged = 5;

  // MFC ids of earlier imports absent from this export, of a figure whose
  // decision tombstoned at least one occurrence status.
  uint32 removed = 6;

  // Feed events this import produced, its marker and the server-owned items
  // included. A re-import of the same export produces the marker and nothing
  // else, bar the items it clears.
  uint32 facets_written = 7;

  // Resolved rows, not added, of a figure whose decision is a conflict this
  // import left for the user (ASK), the app's side kept meanwhile. The 0.2.x
  // name, a 0.3.0 meaning.
  uint32 kept_newer = 8;

  // Copies this import made live: created, or restored after an earlier
  // import removed them.
  uint32 occurrences_added = 9;

  // Existing occurrences whose status this import changed to another kind.
  uint32 occurrences_status_changed = 10;

  // Occurrences whose status this import tombstoned.
  uint32 occurrences_removed = 11;

  // Figure items of kind conflict this import raised, or changed (a new rev).
  uint32 conflicts_raised = 12;

  // Figure items of kind conflict pending after this import, earlier ones
  // included.
  uint32 conflicts_pending = 13;

  // Figure items of kind divergence pending after this import.
  uint32 divergences_pending = 14;

  // 15 was changes_held, in an unpublished 0.3.0 draft that could hold a change
  // only MFC made for confirmation.
  reserved 15;
  reserved "changes_held";

  // Align-MFC entries pending after this import; a dismissed one is not.
  uint32 align_pending = 16;

  // This import's per-user counter: the middle segment of its version and the
  // `import` of its marker imp/{site}/import.
  uint32 import_number = 17;

  // THE REVIEW SET (R7), in order: conflict, divergence and held edits, then
  // the align-MFC group. A group with no item is left out.
  repeated ImportReviewGroup review = 18;

  // The change entries this import made (kind applied, favor_app or
  // favor_mfc), each answerable with undo or dismiss.
  repeated ImportReviewItem applied = 19;
}

// What an item of the review set is (THE REVIEW SET above).
enum ImportReviewKind {
  IMPORT_REVIEW_KIND_UNSPECIFIED = 0;

  // A figure item of kind "conflict": both sides changed, differently.
  IMPORT_REVIEW_KIND_CONFLICT = 1;

  // 2 was a held MFC change, in an unpublished 0.3.0 draft.
  reserved 2;
  reserved "IMPORT_REVIEW_KIND_MFC_CHANGE";

  // A figure item of kind "divergence": only the app changed; MFC is behind.
  IMPORT_REVIEW_KIND_DIVERGENCE = 3;

  // A held-edit card imp/{site}/held/{head_id} (HELD above).
  IMPORT_REVIEW_KIND_HELD_EDITS = 4;

  // An align-MFC entry imp/{site}/align/{head_id} (ALIGN-MFC above).
  IMPORT_REVIEW_KIND_ALIGN_MFC = 5;
}

// An answer, as res/{site}/{head_id} writes it in `choice` (ITEMS AND ANSWERS).
enum ImportAnswer {
  IMPORT_ANSWER_UNSPECIFIED = 0;

  // "keep": the app's side stands ("MFC is behind" on a divergence).
  IMPORT_ANSWER_KEEP = 1;

  // "take": MFC's side is made true.
  IMPORT_ANSWER_TAKE = 2;

  // "per_copy": final statuses per copy, and a side per disputed field.
  IMPORT_ANSWER_PER_COPY = 3;

  // "undo": revert a change entry.
  IMPORT_ANSWER_UNDO = 4;

  // "dismiss": drop a change or align-MFC entry from view.
  IMPORT_ANSWER_DISMISS = 5;
}

// One group of the review set: every item of one kind, and the answers that
// may be given to all of them at once.
message ImportReviewGroup {
  ImportReviewKind kind = 1;

  // In head_id order.
  repeated ImportReviewItem items = 2;

  // The answers a client may give every item of the group at once, by writing
  // one res/{site}/{head_id} per item.
  repeated ImportAnswer bulk = 3;
}

// One item: a server-owned facet the user may answer.
message ImportReviewItem {
  // The item's facet key, imp/{site}/figure|held|change|align/{head_id}.
  string facet_key = 1;

  // The figure: the survivor's head_id.
  string head_id = 2;

  // The rev an answer names (res/{site}/{head_id} `rev`), with the item it
  // names (`item`: figure, held, change or align, as facet_key has it).
  string rev = 3;

  // The answers this item allows.
  repeated ImportAnswer answers = 4;

  // The facet's payload as JSON text (sync.proto rule 3), under its closed
  // schema (schemas/imp-figure|held|change|align.schema.json), the same the
  // client gets from Delta.
  string payload = 5;
}

message UnresolvedMfcRow {
  // The MFC item id as it appears in the export.
  string mfc_id = 1;

  // The export's Status value for the row, verbatim.
  string status = 2;

  // 1-based line number in csv_text, header included.
  uint32 line = 3;

  // Why nothing was written, the first that applies: "invalid_id",
  // "duplicate_id", "invalid_count", "count_over_99" or "no_product" (ROWS
  // above). Empty from a 0.2.x server, meaning "no_product".
  string reason = 4;
}

// ---------------------------------------------------------------------------
// ImportService
//
// ERROR CONTRACT:
//   * a missing ID or Status column -> INVALID_ARGUMENT naming the column.
//   * csv_text over 2 MiB, or export_date not "YYYY-MM-DD" -> INVALID_ARGUMENT.
//   * export_date later than the server's current UTC date plus one day
//     -> INVALID_ARGUMENT. MFC stamps the date in its own zone, which can run
//     a day ahead of UTC; anything later is a typo or a parse bug.
//   * missing or invalid OIDC token or DPoP proof -> UNAUTHENTICATED.
//   * spine unreachable -> UNAVAILABLE; nothing is written. A retry is safe:
//     re-importing the same export writes nothing new.
// ---------------------------------------------------------------------------
service ImportService {
  rpc ImportMfcExport(ImportMfcExportRequest) returns (ImportMfcExportResponse);
}
